name: Deploy Photo Collect API Demo

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy via SFTP
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      REMOTE_PATH: ${{ vars.SFTP_REMOTE_PATH }}

    steps:
      - name: Validate deployment path
        run: |
          if [[ "${REMOTE_PATH}" != /* || "${REMOTE_PATH}" == / ]]; then
            echo "::error::Set the SFTP_REMOTE_PATH repository variable to the absolute application directory on the SFTP server."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Build frontend assets
        run: |
          npm ci
          npm run build:css

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, mbstring
          tools: composer:v2
          coverage: none

      - name: Install PHP dependencies
        run: >
          composer install
          --no-dev
          --prefer-dist
          --no-interaction
          --no-progress
          --optimize-autoloader

      - name: Prepare deployment package
        run: |
          mkdir -p deployment/config
          cp -a config/app.ini.example deployment/config/
          cp -a \
            public \
            src \
            templates \
            vendor \
            composer.json \
            composer.lock \
            deployment/

      - name: Deploy via SFTP
        uses: milanmk/actions-file-deployer@b204fec5b826c391b116c40b789df470a4fb6870 # 1.18
        with:
          remote-protocol: sftp
          remote-host: ${{ secrets.SFTP_HOST }}
          remote-user: ${{ secrets.SFTP_USER }}
          remote-password: ${{ secrets.SFTP_PASSWORD }}
          remote-port: 22
          remote-path: ${{ env.REMOTE_PATH }}
          local-path: deployment
          sync: full
          ftp-options: set cmd:fail-exit yes

      - name: Verify deployment
        env:
          SSHPASS: ${{ secrets.SFTP_PASSWORD }}
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes openssh-client sshpass

          batch_file="${RUNNER_TEMP}/verify-deployment.sftp"
          revision_file="${RUNNER_TEMP}/remote-deploy-revision"
          printf 'get "%s/.deploy-revision" "%s"\n' \
            "${REMOTE_PATH%/}" \
            "${revision_file}" \
            > "${batch_file}"

          sshpass -e sftp \
            -o BatchMode=no \
            -o StrictHostKeyChecking=accept-new \
            -P 22 \
            -b "${batch_file}" \
            "${SFTP_USER}@${SFTP_HOST}"

          remote_revision="$(tr -d '\r\n' < "${revision_file}")"
          if [ "${remote_revision}" != "${GITHUB_SHA}" ]; then
            echo "::error::Deployment verification failed: the remote revision does not match ${GITHUB_SHA}."
            exit 1
          fi

          echo "Deployment verified at revision ${GITHUB_SHA}."
